  <style>

<body>
  <header>
    <div class="eyebrow">Les Archives de Scylla</div>
    <h1>La Bibliothèque</h1>
    <p>Chaque grimoire renferme une épreuve. Certains secrets attendent encore d'être révélés…</p>
    <a class="back" href="index.html">← Retour à l'accueil</a>
  </header>

  <main>
    <div id="library-status" class="status">Ouverture des Archives…</div>
    <div id="library"></div>
  </main>

  <footer>Les secrets n'appartiennent qu'à ceux qui osent les découvrir.</footer>

  <script>
    const library = document.getElementById("library");
    const status = document.getElementById("library-status");

    function roman(number) {
      const values = [
        [1000, "M"], [900, "CM"], [500, "D"], [400, "CD"],
        [100, "C"], [90, "XC"], [50, "L"], [40, "XL"],
        [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]
      ];

      let result = "";

      for (const [value, symbol] of values) {
        while (number >= value) {
          result += symbol;
          number -= value;
        }
      }

      return result || String(number);
    }

    function bookArtwork() {
      return `
        <svg viewBox="0 0 100 110" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17 17 Q50 7 83 17 L83 91 Q50 81 17 91 Z"
                stroke="currentColor" stroke-width="2"/>
          <path d="M23 23 Q50 15 77 23 L77 84 Q50 76 23 84 Z"
                stroke="currentColor" stroke-width="1"/>
          <path d="M50 20 V79" stroke="currentColor" stroke-width="2"/>
          <path d="M31 35 Q40 28 47 35 V69 Q39 63 31 69 Z"
                stroke="currentColor" stroke-width="1.5"/>
          <path d="M53 35 Q60 28 69 35 V69 Q61 63 53 69 Z"
                stroke="currentColor" stroke-width="1.5"/>
          <path d="M50 40 L54 47 L62 48 L56 54 L57 62 L50 58 L43 62 L44 54 L38 48 L46 47 Z"
                stroke="currentColor" stroke-width="1.5"/>
          <circle cx="50" cy="49" r="25" stroke="currentColor"
                  stroke-width=".7" stroke-dasharray="2 4"/>
          <path d="M12 12 L18 12 L18 18 M82 12 L88 12 L88 18
                   M12 90 L18 90 L18 96 M82 90 L88 90 L88 96"
                stroke="currentColor" stroke-width="1.5"/>
        </svg>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // Affiche l'état de chaque chapitre selon ses dates Supabase.
    function renderLibrary(chapters) {
      library.innerHTML = "";

      const now = Date.now();

      const maxVolume = Math.max(
        1,
        ...chapters.map(chapter => Number(chapter.volume_number) || 1)
      );

      const volumes = new Map();

      for (let volume = 1; volume <= maxVolume; volume++) {
        volumes.set(volume, []);
      }

      for (const chapter of chapters) {
        const volume = Number(chapter.volume_number) || 1;

        if (!volumes.has(volume)) {
          volumes.set(volume, []);
        }

        volumes.get(volume).push(chapter);
      }

      for (const [volumeNumber, volumeChapters] of volumes) {
        const section = document.createElement("section");
        section.className = "volume";

        const cards = [];

        for (const chapter of volumeChapters) {
          const chapterNumber = Number(chapter.chapter_number) || 0;
          const published = chapter.is_published === true;

          const opensAt = Date.parse(chapter.opens_at || "");
          const closesAt = Date.parse(chapter.closes_at || "");

          let state = "sealed";
          let label = "Scellé";
          let description = "Ce secret n'a pas encore été dévoilé.";
          let canParticipate = false;

          if (published) {
            if (
              !chapter.opens_at ||
              !chapter.closes_at ||
              !Number.isFinite(opensAt) ||
              !Number.isFinite(closesAt) ||
              closesAt <= opensAt
            ) {
              label = "Horaires à définir";
              description = "Les horaires de cette épreuve ne sont pas configurés.";
            } else if (now < opensAt) {
              label = "À venir";
              description = "Ce grimoire n'est pas encore ouvert.";
            } else if (now >= closesAt) {
              label = "Fermé";
              description = "Le temps de cette épreuve est écoulé.";
            } else {
              state = "available";
              label = "Ouvert";
              description = "Le grimoire est ouvert. L'épreuve vous attend.";
              canParticipate = true;
            }
          }

          const teaser = chapter.teaser_title ||
            chapter.title ||
            `Chapitre ${roman(chapterNumber)}`;

          cards.push(`
            <article class="book ${state === "available" ? "available" : "sealed"}">
              <div class="book-top">
                <span>Chapitre ${roman(chapterNumber)}</span>
                <span>${label}</span>
              </div>

              <div class="book-art">${bookArtwork()}</div>

              <div class="book-info">
                <h3>${escapeHtml(teaser)}</h3>
                <p>${description}</p>
              </div>

              ${canParticipate
                ? `<a class="book-action" href="quiz.html?chapterId=${encodeURIComponent(chapter.id)}">PARTICIPER</a>`
                : `<span class="book-action" aria-disabled="true">${label.toUpperCase()}</span>`}
            </article>
          `);
        }

        section.innerHTML = `
          <div class="volume-heading">
            <div>
              <h2>Volume ${roman(volumeNumber)}</h2>
              <p class="volume-subtitle">${volumeChapters.length} grimoire(s) dans les Archives</p>
            </div>
          </div>

          <div class="books">${cards.join("")}</div>
        `;

        library.appendChild(section);
      }

      if (chapters.length === 0) {
        status.textContent = "Aucun grimoire n'est encore répertorié.";
        return;
      }

      status.style.display = "none";
    }

    async function loadLibrary() {
      try {
        const response = await fetch("/.netlify/functions/quiz", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "listChapters"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Impossible de consulter les Archives."
          );
        }

        const chapters = Array.isArray(data.chapters)
          ? data.chapters
          : [];

        renderLibrary(chapters);
      } catch (error) {
        status.textContent =
          "Impossible d'ouvrir les Archives pour le moment. Réessaie dans quelques instants.";

        status.classList.add("error");

        console.error("Erreur de chargement des chapitres :", error);
      }
    }

    loadLibrary();
  </script>
</body>
</html>
